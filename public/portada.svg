<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
  <!-- Portada de Amazonas vs Leñadores: selva amazónica en caos (humo, máquinas, río) y el chigüiro en primer plano.
       Ilustración original, estilo plano con contorno negro grueso. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7ca6d8" />
      <stop offset="0.45" stop-color="#e4cfcb" />
      <stop offset="0.75" stop-color="#ffdaaa" />
      <stop offset="1" stop-color="#ffc98a" />
    </linearGradient>
    <linearGradient id="river" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#58bcd8" />
      <stop offset="1" stop-color="#2f8db3" />
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff9a3c" stop-opacity="0.7" />
      <stop offset="1" stop-color="#ff9a3c" stop-opacity="0" />
    </radialGradient>
    <g id="leaf">
      <path d="M0 0 C 30 -60 110 -70 160 -10 C 110 30 40 40 0 0 Z" />
    </g>
    <g id="bigleaf">
      <path d="M0 0 C 40 -120 200 -170 300 -60 C 220 40 90 70 0 0 Z" />
      <path d="M0 0 C 90 -40 180 -70 290 -62" fill="none" stroke="#21170f" stroke-width="5" stroke-linecap="round" />
    </g>
  </defs>

  <!-- cielo con humo de quemas -->
  <rect width="1600" height="1000" fill="url(#sky)" />
  <circle cx="860" cy="330" r="380" fill="url(#glow)" />
  <g fill="#8d8a86" opacity="0.55">
    <circle cx="760" cy="250" r="70" /><circle cx="820" cy="190" r="85" /><circle cx="900" cy="140" r="95" />
    <circle cx="990" cy="120" r="80" /><circle cx="700" cy="300" r="55" /><circle cx="1060" cy="90" r="70" />
  </g>
  <g fill="#6f6b67" opacity="0.5">
    <circle cx="1180" cy="230" r="60" /><circle cx="1230" cy="170" r="75" /><circle cx="1300" cy="120" r="80" /><circle cx="1380" cy="90" r="70" />
  </g>

  <!-- loma lejana talada: tocones y una excavadora -->
  <path d="M520 470 C 650 380 820 360 980 400 C 1120 430 1240 380 1400 410 L 1600 430 L 1600 560 L 520 560 Z" fill="#c9a06a" />
  <g fill="#7b5232">
    <rect x="640" y="410" width="14" height="22" rx="4" /><rect x="700" y="398" width="16" height="24" rx="4" />
    <rect x="790" y="392" width="14" height="20" rx="4" /><rect x="1010" y="408" width="15" height="22" rx="4" />
    <rect x="1290" y="398" width="14" height="20" rx="4" /><rect x="1350" y="404" width="16" height="22" rx="4" />
  </g>
  <g fill="#e2bb83"><ellipse cx="647" cy="410" rx="7" ry="3" /><ellipse cx="708" cy="398" rx="8" ry="3" /><ellipse cx="797" cy="392" rx="7" ry="3" /><ellipse cx="1017" cy="408" rx="8" ry="3" /></g>
  <!-- excavadora (silueta caricatura) -->
  <g transform="translate(1110 330)" stroke="#21170f" stroke-width="5" stroke-linejoin="round">
    <rect x="0" y="62" width="120" height="28" rx="14" fill="#3a3a3a" />
    <rect x="12" y="20" width="96" height="46" rx="12" fill="#f2b705" />
    <rect x="58" y="-6" width="46" height="40" rx="10" fill="#f2b705" />
    <rect x="66" y="2" width="30" height="20" rx="5" fill="#bfe6f2" />
    <path d="M14 34 L -40 -18 L -78 20" fill="none" stroke-width="16" stroke-linecap="round" />
    <path d="M14 34 L -40 -18 L -78 20" fill="none" stroke="#f2b705" stroke-width="8" stroke-linecap="round" />
    <path d="M-92 12 L -64 12 L -70 44 L -96 36 Z" fill="#8f9a9c" />
  </g>
  <!-- árbol cayendo -->
  <g transform="translate(900 300) rotate(38)" stroke="#21170f" stroke-width="5">
    <rect x="-9" y="0" width="18" height="110" rx="6" fill="#8b6644" />
    <circle cx="0" cy="-10" r="40" fill="#4cb658" />
  </g>


  <!-- brasas y hojas arrastradas por el viento -->
  <g fill="#ff8a1f"><circle cx="720" cy="360" r="6" /><circle cx="780" cy="320" r="4" /><circle cx="960" cy="260" r="5" /><circle cx="1050" cy="300" r="4" /><circle cx="860" cy="200" r="3" /><circle cx="1240" cy="300" r="5" /></g>
  <g fill="#ffd21f"><circle cx="740" cy="280" r="3" /><circle cx="1000" cy="200" r="3" /><circle cx="1160" cy="270" r="3" /></g>
  <g stroke="#21170f" stroke-width="3" fill="#7bc96f">
    <use href="#leaf" transform="translate(700 470) rotate(-30) scale(0.25)" />
    <use href="#leaf" transform="translate(1320 470) rotate(40) scale(0.22)" />
    <use href="#leaf" transform="translate(480 250) rotate(10) scale(0.25)" fill="#e3913a" />
    <use href="#leaf" transform="translate(1080 400) rotate(-60) scale(0.2)" fill="#c9a06a" />
  </g>

  <!-- selva media: copas redondas -->
  <g stroke="#21170f" stroke-width="4">
    <g fill="#2f7d3a">
      <circle cx="40" cy="380" r="120" /><circle cx="210" cy="330" r="130" /><circle cx="380" cy="390" r="120" />
      <circle cx="520" cy="430" r="90" /><circle cx="1480" cy="380" r="120" /><circle cx="1600" cy="330" r="110" />
    </g>
    <g fill="#3a9447">
      <circle cx="120" cy="470" r="110" /><circle cx="300" cy="470" r="100" /><circle cx="460" cy="500" r="80" />
      <circle cx="1420" cy="480" r="100" /><circle cx="1560" cy="470" r="100" />
    </g>
    <rect x="190" y="420" width="30" height="200" fill="#7a573a" />
    <rect x="1480" y="440" width="28" height="200" fill="#7a573a" />
  </g>

  <!-- río -->
  <path d="M0 600 C 300 560 600 620 900 590 C 1150 565 1400 600 1600 580 L 1600 800 L 0 800 Z" fill="url(#river)" stroke="#21170f" stroke-width="5" />
  <g fill="none" stroke="#e6fbff" stroke-width="7" stroke-linecap="round" opacity="0.8">
    <path d="M90 650 q 40 -12 80 0" /><path d="M340 690 q 50 -14 100 0" /><path d="M640 640 q 40 -12 80 0" />
    <path d="M820 700 q 50 -14 100 0" /><path d="M1050 650 q 40 -12 80 0" /><path d="M1300 690 q 40 -12 80 0" />
  </g>
  <!-- gotas de agua -->
  <g stroke="#21170f" stroke-width="5" fill="#3fb2ec">
    <path d="M560 610 c 12 18 24 34 24 48 a 24 24 0 0 1 -48 0 c 0 -14 12 -30 24 -48 Z" />
    <path d="M760 660 c 9 14 18 26 18 37 a 18 18 0 0 1 -36 0 c 0 -11 9 -23 18 -37 Z" />
  </g>
  <g fill="#ffffff"><ellipse cx="552" cy="655" rx="5" ry="9" /><ellipse cx="754" cy="696" rx="4" ry="7" /></g>

  <!-- orilla cercana -->
  <path d="M0 780 C 300 740 600 790 900 760 C 1200 735 1400 770 1600 750 L 1600 1000 L 0 1000 Z" fill="#5fb04a" stroke="#21170f" stroke-width="6" />
  <path d="M0 860 C 400 830 800 880 1600 840 L 1600 1000 L 0 1000 Z" fill="#4fa040" />

  <!-- lianas -->
  <g fill="none" stroke="#2f6e2a" stroke-width="9" stroke-linecap="round">
    <path d="M620 0 C 600 120 660 200 630 300" /><path d="M1520 0 C 1500 150 1560 220 1530 330" /><path d="M1010 0 C 1000 60 1030 100 1015 150" />
  </g>
  <g fill="#4caf50" stroke="#21170f" stroke-width="3">
    <ellipse cx="628" cy="120" rx="16" ry="9" transform="rotate(-30 628 120)" /><ellipse cx="642" cy="215" rx="16" ry="9" transform="rotate(25 642 215)" />
    <ellipse cx="1512" cy="140" rx="16" ry="9" transform="rotate(-30 1512 140)" /><ellipse cx="1548" cy="240" rx="16" ry="9" transform="rotate(25 1548 240)" />
  </g>

  <!-- guacamaya volando -->
  <g transform="translate(1180 210) rotate(-12)" stroke="#21170f" stroke-width="5" stroke-linejoin="round">
    <path d="M-70 10 L -150 40 L -140 20 L -170 30 L -80 -5 Z" fill="#2f6fd6" />
    <ellipse cx="0" cy="0" rx="70" ry="30" fill="#e2392b" />
    <path d="M-10 -10 C 10 -90 70 -110 110 -90 C 70 -70 40 -40 30 0 Z" fill="#f2c318" />
    <path d="M10 -40 C 40 -90 90 -100 110 -90" fill="none" stroke="#2f6fd6" stroke-width="10" />
    <circle cx="60" cy="-6" r="26" fill="#e2392b" />
    <path d="M82 -14 C 104 -10 106 12 88 18 Z" fill="#3a3a3a" />
    <circle cx="66" cy="-12" r="5" fill="#21170f" stroke="none" />
  </g>

  <!-- mariposas morfo -->
  <g stroke="#21170f" stroke-width="3">
    <g transform="translate(1010 470) rotate(-15)"><path d="M0 0 C -30 -40 -50 -10 -30 10 Z" fill="#2f8cff" /><path d="M0 0 C 30 -40 50 -10 30 10 Z" fill="#2f8cff" /><ellipse cx="0" cy="2" rx="3" ry="12" fill="#21170f" /></g>
    <g transform="translate(560 520) rotate(20) scale(0.8)"><path d="M0 0 C -30 -40 -50 -10 -30 10 Z" fill="#2f8cff" /><path d="M0 0 C 30 -40 50 -10 30 10 Z" fill="#2f8cff" /><ellipse cx="0" cy="2" rx="3" ry="12" fill="#21170f" /></g>
  </g>

  <!-- hojas grandes del frente (marco) -->
  <g stroke="#21170f" stroke-width="6" stroke-linejoin="round">
    <use href="#bigleaf" transform="translate(-40 260) rotate(-20) scale(1.2)" fill="#2e8b3a" />
    <use href="#bigleaf" transform="translate(-60 140) rotate(15) scale(1.1)" fill="#45ad52" />
    <use href="#bigleaf" transform="translate(1640 220) scale(-1.2 1.2) rotate(-10)" fill="#2e8b3a" />
    <use href="#bigleaf" transform="translate(1640 40) scale(-1 1) rotate(20)" fill="#3aa048" />
    <use href="#bigleaf" transform="translate(-30 1010) rotate(-50) scale(1.1)" fill="#3aa048" />
    <use href="#bigleaf" transform="translate(520 1040) rotate(-80) scale(0.9)" fill="#2e8b3a" />
    <use href="#bigleaf" transform="translate(1630 1010) scale(-1.1 1.1) rotate(-45)" fill="#2e8b3a" />
    <use href="#leaf" transform="translate(860 1000) rotate(-70) scale(1.2)" fill="#45ad52" />
    <use href="#leaf" transform="translate(940 1000) rotate(-110) scale(1.1)" fill="#2e8b3a" />
  </g>

  <!-- heliconias -->
  <g stroke="#21170f" stroke-width="4" stroke-linejoin="round">
    <g transform="translate(980 860)">
      <path d="M0 140 L 0 0" stroke="#3a7a2a" stroke-width="8" />
      <path d="M0 0 L 34 -14 L 4 -30 Z" fill="#e8352b" /><path d="M2 -30 L -30 -46 L 0 -60 Z" fill="#e8352b" />
      <path d="M0 -60 L 30 -76 L 2 -90 Z" fill="#e8352b" />
      <path d="M8 -12 L 26 -14 L 10 -24 Z" fill="#ffd21f" stroke="none" /><path d="M-6 -44 L -22 -46 L -8 -54 Z" fill="#ffd21f" stroke="none" />
    </g>
    <g transform="translate(110 900) scale(0.9)">
      <path d="M0 140 L 0 0" stroke="#3a7a2a" stroke-width="8" />
      <path d="M0 0 L 34 -14 L 4 -30 Z" fill="#ff8a1f" /><path d="M2 -30 L -30 -46 L 0 -60 Z" fill="#ff8a1f" />
      <path d="M0 -60 L 30 -76 L 2 -90 Z" fill="#ff8a1f" />
    </g>
  </g>

  <!-- rana dardo sobre una hoja -->
  <g transform="translate(860 905)" stroke="#21170f" stroke-width="4">
    <ellipse cx="0" cy="22" rx="70" ry="18" fill="#3a9447" />
    <ellipse cx="0" cy="0" rx="34" ry="24" fill="#ffd21f" />
    <path d="M-20 -6 q 10 10 22 0 M 6 8 q 10 8 20 -2" fill="none" stroke="#21170f" stroke-width="6" stroke-linecap="round" />
    <circle cx="-14" cy="-20" r="11" fill="#ffd21f" /><circle cx="14" cy="-20" r="11" fill="#ffd21f" />
    <circle cx="-14" cy="-21" r="5" fill="#21170f" stroke="none" /><circle cx="14" cy="-21" r="5" fill="#21170f" stroke="none" />
  </g>

  <!-- ───── el chigüiro (primer plano) ───── -->
  <g stroke="#21170f" stroke-width="10" stroke-linejoin="round" stroke-linecap="round">
    <ellipse cx="1290" cy="955" rx="280" ry="34" fill="#21170f" opacity="0.22" stroke="none" />
    <!-- patas de atrás -->
    <rect x="1405" y="840" width="62" height="110" rx="28" fill="#8a5a32" />
    <rect x="1300" y="860" width="60" height="96" rx="28" fill="#8a5a32" />
    <!-- cuerpo -->
    <path d="M1080 760 C 1080 620 1230 590 1350 600 C 1480 610 1540 690 1530 790 C 1520 890 1420 920 1280 915 C 1150 910 1080 870 1080 760 Z" fill="#a8703f" />
    <!-- pelaje -->
    <path d="M1330 640 q 18 -16 34 0 M 1420 660 q 16 -14 30 2 M 1470 730 q 14 -12 26 4" fill="none" stroke-width="7" />
    <ellipse cx="1300" cy="820" rx="120" ry="60" fill="#b9814c" stroke="none" />
    <!-- patas de adelante -->
    <rect x="1120" y="830" width="64" height="122" rx="30" fill="#96633a" />
    <rect x="1215" y="850" width="62" height="106" rx="30" fill="#96633a" />
    <!-- cabeza -->
    <path d="M940 600 C 930 520 990 470 1080 465 C 1170 460 1250 490 1265 560 C 1280 640 1230 700 1140 715 C 1050 728 950 690 940 600 Z" fill="#a8703f" />
    <!-- orejas -->
    <ellipse cx="1160" cy="468" rx="30" ry="24" fill="#8a5a32" transform="rotate(-20 1160 468)" />
    <ellipse cx="1222" cy="488" rx="28" ry="22" fill="#8a5a32" transform="rotate(25 1222 488)" />
    <!-- hocico -->
    <path d="M935 560 C 935 520 975 505 1010 512 C 1050 520 1062 560 1055 600 C 1046 645 1000 662 965 650 C 940 640 932 600 935 560 Z" fill="#c48a55" stroke="none" />
    <rect x="928" y="538" width="62" height="38" rx="19" fill="#4a3020" />
    <ellipse cx="946" cy="556" rx="6" ry="8" fill="#21170f" stroke="none" /><ellipse cx="972" cy="556" rx="6" ry="8" fill="#21170f" stroke="none" />
    <path d="M960 610 q 18 18 42 4" fill="none" stroke-width="8" />
    <!-- ojos de punto con brillo -->
    <circle cx="1075" cy="545" r="17" fill="#21170f" stroke="none" />
    <circle cx="1068" cy="538" r="6" fill="#ffffff" stroke="none" />
    <circle cx="1170" cy="540" r="16" fill="#21170f" stroke="none" />
    <circle cx="1163" cy="533" r="5.5" fill="#ffffff" stroke="none" />
    <!-- cachetes -->
    <ellipse cx="1050" cy="615" rx="28" ry="15" fill="#f29b8a" stroke="none" opacity="0.85" />
    <ellipse cx="1205" cy="600" rx="26" ry="14" fill="#f29b8a" stroke="none" opacity="0.85" />
    <!-- pañoleta naranja (PyCon) -->
    <path d="M1105 700 C 1150 720 1230 712 1272 680 L 1290 712 C 1240 752 1150 760 1095 735 Z" fill="#f59216" />
    <path d="M1180 735 L 1215 800 L 1245 728 Z" fill="#e3913a" />
    <circle cx="1205" cy="758" r="7" fill="#fffdf7" stroke-width="4" />
    <!-- pajarito en el lomo -->
    <g transform="translate(1390 585)" stroke-width="7">
      <path d="M-40 6 L -80 18 L -46 -6 Z" fill="#2f8f3d" />
      <ellipse cx="0" cy="0" rx="46" ry="32" fill="#f2c318" />
      <path d="M-18 -4 C -6 -24 18 -26 28 -12" fill="none" stroke-width="6" />
      <circle cx="30" cy="-24" r="24" fill="#f2c318" />
      <path d="M50 -28 L 74 -20 L 50 -12 Z" fill="#ff8a1f" />
      <circle cx="36" cy="-28" r="5" fill="#21170f" stroke="none" />
      <path d="M-6 30 L -10 46 M 12 30 L 10 46" fill="none" stroke-width="6" />
    </g>
  </g>
</svg>
